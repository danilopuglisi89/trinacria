<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>TRINACRIA — La Conquista della Sicilia</title>
<link rel="stylesheet" href="css/style.css?v=163">
<link rel="icon" type="image/png" href="assets/favicon.png?v=163">
</head>
<body>

<!-- SCHERMATA INIZIALE -->
<div id="avvio">
  <h1>🔱 TRINACRIA</h1>
  <div class="sottotitolo">La conquista della Sicilia — 735 a.C. / 1700 d.C. — 166 comuni reali, sei ere, una sola corona</div>

  <div id="avvio-fazioni"></div>

  <!-- CREAZIONE DEL SOVRANO -->
  <div id="crea-sovrano">
    <div class="cs-titolo">✦ Il tuo Sovrano ✦</div>
    <div class="cs-corpo">
      <canvas id="sov-ritratto" width="240" height="300"></canvas>
      <div id="cs-opzioni"></div>
    </div>
  </div>

  <div id="avvio-opzioni">
    <label>Velocità:
      <select id="sel-velocita">
        <option value="blitz">Blitz (~85 turni)</option>
        <option value="normale" selected>Normale (~180 turni)</option>
        <option value="epica">Epica (~330 turni)</option>
      </select>
    </label>
    <label>Difficoltà:
      <select id="sel-difficolta">
        <option value="facile">Picciriddu (facile)</option>
        <option value="normale" selected>Barone (normale)</option>
        <option value="difficile">Re di Sicilia (difficile)</option>
      </select>
    </label>
    <label>Mappa:
      <select id="sel-nebbia">
        <option value="nebbia" selected>Nebbia di guerra (consigliata)</option>
        <option value="aperta">Aperta (vedi tutto)</option>
      </select>
    </label>
  </div>

  <button id="btn-inizia">INIZIA LA CONQUISTA</button>

  <div id="avvio-salvataggi"></div>
</div>

<!-- GIOCO -->
<div id="gioco" class="nascosto">
  <canvas id="mappa"></canvas>
  <div id="topbar">
    <div id="logo">🔱 TRINACRIA</div>
    <div id="info-era"></div>
    <div id="risorse"></div>
    <div id="leader-box"></div>
    <div id="bottoni-top">
      <button id="btn-regno">👑 Regno</button>
      <button id="btn-corte">🍴 Corte</button>
      <button id="btn-diplo">🤝 Diplomazia</button>
      <button id="btn-menu">☰ Menu</button>
      <button id="btn-musica">🔇</button>
    </div>
  </div>
  <div id="pannello" class="nascosto"></div>
  <div id="armata" class="nascosto"></div>
  <div id="registro"></div>
  <div id="minimappa-box">
    <button id="mm-toggle" title="Nascondi/mostra la minimappa">🗺️</button>
    <canvas id="minimappa" width="190" height="150" title="Minimappa — tocca per spostarti"></canvas>
  </div>
  <button id="btn-turno">Fine Turno ⏭</button>
  <button id="btn-auto" title="Turno automatico">⏩</button>
  <div id="consigliere" class="nascosto">
    <canvas id="cons-volto" width="72" height="88"></canvas>
    <div id="cons-corpo"><div id="cons-nome">Don Calorio</div><div id="cons-bolla"></div></div>
  </div>
  <div id="potere-banner" class="nascosto"></div>
  <div id="tutorial-card" class="nascosto"></div>
  <div id="fumetto" class="nascosto">
    <canvas id="fum-volto" width="60" height="60"></canvas>
    <div id="fum-bolla"><div id="fum-nome"></div><div id="fum-testo"></div></div>
  </div>
  <div id="modale-sfondo" class="nascosto"><div id="modale"></div></div>
</div>

<script src="js/data_comuni.js?v=163"></script>
<script src="js/data_luoghi.js?v=163"></script>
<script src="js/data_sponsor.js?v=163"></script>
<script src="js/data_poi.js?v=163"></script>
<script src="js/data_game.js?v=163"></script>
<script src="js/art.js?v=163"></script>
<script src="js/art3d.js?v=163"></script>
<script src="js/fx.js?v=163"></script>
<script src="js/sprites.js?v=163"></script>
<script src="js/map.js?v=163"></script>
<script src="js/game.js?v=163"></script>
<script src="js/ai.js?v=163"></script>
<script src="js/save.js?v=163"></script>
<script src="js/audio.js?v=163"></script>
<script src="js/ui.js?v=163"></script>
<script src="js/main.js?v=163"></script>
</body>
</html>
